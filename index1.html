<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX</title>

    <link rel="stylesheet" href="style1.css">
</head>
<body>


    <!-- ================= NAVBAR ================= -->

    <div class="navbar">

        <div class="logo">
            ScaleX
        </div>

        <div class="menu">

            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Blogs</a>
            <a href="#">Contact Us</a>

        </div>

        <button class="btn">
            Get Started
        </button>

    </div>





    <!-- ================= HERO ================= -->

    <div class="hero">

        <h1>Insights & Blogs</h1>

        <div class="categories">

            <button class="active">
                All
            </button>

            <button class="normal-btn">
                Tech
            </button>

            <button class="normal-btn">
                SaaS
            </button>

            <button class="normal-btn">
                Marketing
            </button>

        </div>

    </div>





    <!-- ================= CARDS ================= -->

    <div class="cards-section">



        <!-- CARD 1 -->

        <div class="card">

            <img src="nasa.jpg" alt="space">

            <div class="content">

                <span class="tag">
                    Tech
                </span>

                <h2>
                    The Future Of Technology In Space Research
                </h2>

                <p>
                    May 23, 2025
                </p>

            </div>

        </div>





        <!-- CARD 2 -->

        <div class="card">

            <img src="design.jpg" alt="design">

            <div class="content">

                <span class="tag">
                    SaaS
                </span>

                <h2>
                    5 Creative Trends In SaaS Design Systems
                </h2>

                <p>
                    May 23, 2025
                </p>

            </div>

        </div>





        <!-- CARD 3 -->

        <div class="card">

            <img src="team.jpg" alt="workspace">

            <div class="content">

                <span class="tag">
                    Marketing
                </span>

                <h2>
                    How Modern Teams Build Digital Products
                </h2>

                <p>
                    May 23, 2025
                </p>

            </div>

        </div>

    </div>

</body>
</html>
