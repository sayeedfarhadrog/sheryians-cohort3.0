<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mew Pokemon UI</title>

    <link rel="stylesheet" href="style3.css">
</head>
<body>



    <!-- MAIN CONTAINER -->

    <div class="container">



        <!-- LEFT SIDE -->

        <div class="left-side">

            <!-- LOGO -->

      <div class="logo">

    <img src="./pokemon-logo-png-1423.png">

</div>



            <!-- TEXT CONTENT -->

            <div class="content">

                <h3>POKEMON GEN I</h3>

                <h1>Mew</h1>

                <p>
                    Mew is a legendary, mythical Psychic-type Pokémon
                    widely believed to be the ancestor of all Pokémon
                    due to its ability to use all types of moves.
                </p>



                <!-- NUMBER -->

                <div class="number">

                    <div class="line"></div>

                    <span>02 / 08</span>

                </div>

            </div>



            <!-- POKEBALL -->

            <div class="circle"></div>

        </div>





        <!-- RIGHT SIDE -->

        <div class="right-side">

            <!-- MENU -->

            <div class="menu">

                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">About</a>
                <a href="#">Gallery</a>
                <a href="#">Contact</a>

            </div>



            <!-- MENU ICON -->

            <div class="menu-icon">

                <span></span>
                <span></span>
                <span></span>

            </div>



            <!-- DOTS -->

            <div class="dots">

                <div class="black"></div>

                <div></div>
                <div></div>
                <div></div>
                <div></div>

            </div>

        </div>





        <!-- MEW IMAGE -->

        <div class="pokemon-image">

            <img src="Mew-Pokemon-PNG-Pic.png" alt="Mew">

        </div>

    </div>

</body>
</html>
